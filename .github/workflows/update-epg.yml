name: Update 91.3 Ayclt FM EPG

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python environment
        run: python --version

      - name: Show scheduled run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          date -u

      - name: Generate EPG
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: python generate_epg.py

      - name: Check generated EPG files
        run: |
          test -f "91.3_Ayclt_FM_radio_guide.xml"
          test -f "epg.json"
          ls -lh "91.3_Ayclt_FM_radio_guide.xml" "epg.json"

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          filename = "91.3_Ayclt_FM_radio_guide.xml"
          ET.parse(filename)
          print(f"XML validation successful: {filename}")
          PY

      - name: Validate JSON and channel coverage
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          expected = {"913AycltFM", "913AycltFMHD2", "913AycltFMHD3", "913AycltFMLiveStudioCam", "913AycltFMMobileStudioCam"}

          with open("epg.json", encoding="utf-8") as f:
              data = json.load(f)
          if not data:
              raise SystemExit("EPG JSON is empty.")

          json_channels = {item.get("channel_id") for item in data}
          missing_json = expected - json_channels
          if missing_json:
              raise SystemExit(f"EPG JSON is missing channels: {sorted(missing_json)}")

          root = ET.parse("91.3_Ayclt_FM_radio_guide.xml").getroot()
          xml_channels = {channel.get("id") for channel in root.findall("channel")}
          missing_xml = expected - xml_channels
          if missing_xml:
              raise SystemExit(f"EPG XML is missing channels: {sorted(missing_xml)}")

          xml_programmes = root.findall("programme")
          if not xml_programmes:
              raise SystemExit("EPG XML contains no programmes.")

          def xml_time(value):
              dt, offset = value.rsplit(" ", 1)
              sign_char = "+" if offset[0] == "+" else "-"
              return f"{dt[:4]}-{dt[4:6]}-{dt[6:8]}T{dt[8:10]}:{dt[10:12]}:{dt[12:14]}{sign_char}{offset[1:3]}:{offset[3:5]}"

          live_json = {(item.get("channel_id"), item.get("start"), item.get("end"), item.get("title")) for item in data if item.get("live") is True}
          live_xml = set()

          for programme in xml_programmes:
              live_tag = programme.find("live")
              category = programme.find("category")
              subtitle = programme.find("sub-title")
              title = (programme.findtext("title") or "").strip()
              has_live_metadata = live_tag is not None or category is not None or subtitle is not None

              if live_tag is not None:
                  if category is None or (category.text or "").strip().upper() != "LIVE":
                      raise SystemExit("A <live/> programme is missing category=LIVE.")
                  if subtitle is None or (subtitle.text or "").strip().upper() != "LIVE":
                      raise SystemExit("A <live/> programme is missing sub-title=LIVE.")
                  if title.startswith("[LIVE] "):
                      raise SystemExit("A LIVE programme still contains the removed [LIVE] title prefix.")
                  live_xml.add((programme.get("channel"), xml_time(programme.get("start")), xml_time(programme.get("stop")), title))
              elif has_live_metadata:
                  raise SystemExit(f"Programme '{title}' has partial LIVE metadata but no <live/> element.")

          if live_json != live_xml:
              only_json = sorted(live_json - live_xml)
              only_xml = sorted(live_xml - live_json)
              raise SystemExit("LIVE metadata mismatch between JSON and XML.\n" f"Only in JSON: {only_json[:10]}\n" f"Only in XML: {only_xml[:10]}")

          four_channels = {"913AycltFM", "913AycltFMHD2", "913AycltFMHD3", "913AycltFMLiveStudioCam"}
          json_live_by_channel = {channel: 0 for channel in four_channels}
          xml_live_by_channel = {channel: 0 for channel in four_channels}

          for item in data:
              if item.get("channel_id") in four_channels and item.get("live") is True:
                  json_live_by_channel[item["channel_id"]] += 1
          for programme in xml_programmes:
              if programme.find("live") is not None and programme.get("channel") in four_channels:
                  xml_live_by_channel[programme.get("channel")] += 1

          if json_live_by_channel != xml_live_by_channel:
              raise SystemExit("Per-channel LIVE metadata counts do not match: " f"JSON={json_live_by_channel}, XML={xml_live_by_channel}")

          print(f"JSON validation successful: {len(data)} programmes; {len(json_channels)} channels; {len(live_json)} LIVE programmes.")
          print(f"XML validation successful: {len(xml_programmes)} programmes; {len(xml_channels)} channels; {len(live_xml)} LIVE programmes.")
          print(f"Per-channel LIVE counts: {json_live_by_channel}")
          PY

      - name: Check for changes
        id: changes
        run: |
          git status --short
          if git diff --quiet -- "91.3_Ayclt_FM_radio_guide.xml" "epg.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated EPG
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "91.3_Ayclt_FM_radio_guide.xml" "epg.json"
          git commit -m "Update 91.3 Ayclt FM EPG"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected. Preserving the EPG generated by this run."
              git checkout --theirs -- "91.3_Ayclt_FM_radio_guide.xml" "epg.json"
              git add "91.3_Ayclt_FM_radio_guide.xml" "epg.json"
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              echo "EPG push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed because main moved. Retrying..."
            git rebase --abort 2>/dev/null || true
          done
          echo "Unable to push EPG after 3 attempts."
          exit 1

      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No EPG changes detected."
