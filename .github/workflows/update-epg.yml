name: Update 91.3 Ayclt FM EPG

on:
  # Run every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

  # Allow manual runs from GitHub
  workflow_dispatch:

  # Run when these files are changed
  push:
    paths:
      - "generate_epg.py"
      - "streamer_art_cache.json"
      - ".github/workflows/update-epg.yml"


permissions:
  contents: write


# Prevent two 5-minute EPG jobs from writing the generated files
# at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  update-epg:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # ======================================================
      # INSTALL PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Verify Python environment
        run: |
          python --version


      # ======================================================
      # GENERATE EPG
      # ======================================================

      - name: Generate EPG
        run: |
          python generate_epg.py


      # ======================================================
      # CHECK GENERATED FILES
      # ======================================================

      - name: Check generated EPG files
        run: |
          echo "Checking generated files..."

          test -f "91.3_Ayclt_FM_radio_guide.xml"
          test -f "epg.json"

          echo "XML file:"
          ls -lh "91.3_Ayclt_FM_radio_guide.xml"

          echo "JSON file:"
          ls -lh "epg.json"


      # ======================================================
      # VALIDATE XML
      # ======================================================

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          filename = "91.3_Ayclt_FM_radio_guide.xml"

          ET.parse(filename)

          print(f"XML validation successful: {filename}")
          PY


      # ======================================================
      # VALIDATE JSON AND CHANNEL COVERAGE
      # ======================================================

      - name: Validate JSON and channel coverage
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime

          expected = {
              "913AycltFM",
              "913AycltFMHD2",
              "913AycltFMHD3",
              "913AycltFMLiveStudioCam",
          }

          with open("epg.json", encoding="utf-8") as f:
              data = json.load(f)

          if not data:
              raise SystemExit("EPG JSON is empty.")

          json_channels = {item.get("channel_id") for item in data}
          missing_json = expected - json_channels
          if missing_json:
              raise SystemExit(f"EPG JSON is missing channels: {sorted(missing_json)}")

          root = ET.parse("91.3_Ayclt_FM_radio_guide.xml").getroot()
          xml_channels = {channel.get("id") for channel in root.findall("channel")}
          missing_xml = expected - xml_channels
          if missing_xml:
              raise SystemExit(f"EPG XML is missing channels: {sorted(missing_xml)}")

          xml_programmes = root.findall("programme")
          if not xml_programmes:
              raise SystemExit("EPG XML contains no programmes.")

          def xml_time(value):
              # XMLTV: YYYYMMDDHHMMSS +/-HHMM
              dt, offset = value.rsplit(" ", 1)
              sign = 1 if offset[0] == "+" else -1
              hours = int(offset[1:3])
              minutes = int(offset[3:5])
              sign_char = "+" if sign == 1 else "-"
              return f"{dt[:4]}-{dt[4:6]}-{dt[6:8]}T{dt[8:10]}:{dt[10:12]}:{dt[12:14]}{sign_char}{hours:02d}:{minutes:02d}"

          live_json = {
              (
                  item.get("channel_id"),
                  item.get("start"),
                  item.get("end"),
                  item.get("title"),
              )
              for item in data
              if item.get("live") is True
          }

          live_xml = set()

          for programme in xml_programmes:
              live_tag = programme.find("live")
              category = programme.find("category")
              subtitle = programme.find("sub-title")
              title = (programme.findtext("title") or "").strip()

              has_live_metadata = live_tag is not None or category is not None or subtitle is not None

              if live_tag is not None:
                  if category is None or (category.text or "").strip().upper() != "LIVE":
                      raise SystemExit("A <live/> programme is missing category=LIVE.")
                  if subtitle is None or (subtitle.text or "").strip().upper() != "LIVE":
                      raise SystemExit("A <live/> programme is missing sub-title=LIVE.")
                  if title.startswith("[LIVE] "):
                      raise SystemExit("A LIVE programme still contains the removed [LIVE] title prefix.")

                  live_xml.add((
                      programme.get("channel"),
                      xml_time(programme.get("start")),
                      xml_time(programme.get("stop")),
                      title,
                  ))

              elif has_live_metadata:
                  raise SystemExit(
                      f"Programme '{title}' has partial LIVE metadata but no <live/> element."
                  )

          if live_json != live_xml:
              only_json = sorted(live_json - live_xml)
              only_xml = sorted(live_xml - live_json)
              raise SystemExit(
                  "LIVE metadata mismatch between JSON and XML.\n"
                  f"Only in JSON: {only_json[:10]}\n"
                  f"Only in XML: {only_xml[:10]}"
              )

          # Verify each of the four station channels uses the same LIVE
          # metadata contract whenever it has a live programme.
          four_channels = {
              "913AycltFM",
              "913AycltFMHD2",
              "913AycltFMHD3",
              "913AycltFMLiveStudioCam",
          }

          json_live_by_channel = {channel: 0 for channel in four_channels}
          xml_live_by_channel = {channel: 0 for channel in four_channels}

          for item in data:
              if item.get("channel_id") in four_channels and item.get("live") is True:
                  json_live_by_channel[item["channel_id"]] += 1

          for programme in xml_programmes:
              if programme.find("live") is not None and programme.get("channel") in four_channels:
                  xml_live_by_channel[programme.get("channel")] += 1

          if json_live_by_channel != xml_live_by_channel:
              raise SystemExit(
                  "Per-channel LIVE metadata counts do not match: "
                  f"JSON={json_live_by_channel}, XML={xml_live_by_channel}"
              )

          print(
              f"JSON validation successful: {len(data)} programmes; "
              f"{len(json_channels)} channels; {len(live_json)} LIVE programmes."
          )
          print(
              f"XML validation successful: {len(xml_programmes)} programmes; "
              f"{len(xml_channels)} channels; {len(live_xml)} LIVE programmes."
          )
          print(f"Per-channel LIVE counts: {json_live_by_channel}")
          PY


      # ======================================================
      # CHECK FOR CHANGES
      # ======================================================

      - name: Check for changes
        id: changes
        run: |
          git status --short

          if git diff --quiet -- \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json" \
            "streamer_art_cache.json"
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # ======================================================
      # COMMIT UPDATED EPG
      # ======================================================

      - name: Commit updated EPG
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json" \
            "streamer_art_cache.json"

          git commit \
            -m "Update 91.3 Ayclt FM EPG"

          # The scheduled job can start from a slightly older main commit.
          # Rebase onto the current remote before pushing so a newer EPG
          # commit cannot cause a non-fast-forward failure.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected. Preserving the EPG generated by this run."
              git checkout --theirs -- \
                "91.3_Ayclt_FM_radio_guide.xml" \
                "epg.json" \
                "streamer_art_cache.json"
              git add \
                "91.3_Ayclt_FM_radio_guide.xml" \
                "epg.json" \
                "streamer_art_cache.json"
              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin HEAD:main; then
              echo "EPG push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt failed because main moved. Retrying..."
            git rebase --abort 2>/dev/null || true
          done

          echo "Unable to push EPG after 3 attempts."
          exit 1


      # ======================================================
      # NO CHANGES
      # ======================================================

      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No EPG changes detected."
